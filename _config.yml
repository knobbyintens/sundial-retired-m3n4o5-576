title: Harborline Analytics
tagline: Turn every route decision into a margin you can see
description: >-
  Harborline Analytics gives mid-market logistics teams a clear view of what
  each route and dock window actually costs.

url: "https://harborline.io"
baseurl: ""

author:
  name: Harborline Analytics
  email: hello@harborline.io
  address: Havenkade 22, 3011 Rotterdam, Netherlands

collections:
  products:
    output: true
    permalink: /products/:path/
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope:
      path: ""
      type: team
    values:
      layout: page

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
